<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anibook — Random</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="navbar-container">

        <a href="index.html" class="logo">
            <span class="logo-icon">A</span>
            <span class="logo-text">Anibook</span>
        </a>

        <div class="nav-links">

            <a href="index.html" class="nav-link">
                Accueil
            </a>

            <a href="characters.html" class="nav-link">
                Personnages
            </a>

            <a href="random.html" class="nav-link active">
                Random
            </a>

            <a href="quiz.html" class="nav-link">
                Quiz
            </a>

            <a href="admin.html" class="nav-link">
                Admin
            </a>

        </div>

        <button class="nav-toggle" type="button">
            ☰
        </button>

    </div>
</nav>

<main>

    <section class="page-header">

        <div class="container">

            <h1>
                Personnage
                <span class="gradient-text">
                    aléatoire
                </span>
            </h1>

            <p>
                Appuie sur le bouton et laisse Anibook choisir
                ton prochain personnage.
            </p>

        </div>

    </section>

    <section class="randomizer container">

        <div class="randomizer-panel">

            <div class="randomizer-controls">

                <button
                    id="random-button"
                    class="btn btn-primary btn-lg"
                    type="button"
                >
                    ⚡ Piocher un personnage
                </button>

            </div>

            <div
                id="random-loading"
                class="loading"
                hidden
            >
                Recherche d'un personnage...
            </div>

            <div
                id="random-error"
                class="alert"
                hidden
            >
                Impossible de récupérer un personnage.
            </div>

            <div
                id="random-character"
                class="random-character"
                hidden
            >

                <div class="random-character-image">

                    <img
                        id="random-image"
                        src=""
                        alt=""
                    >

                </div>

                <div>

                    <span class="tag orange">
                        Personnage aléatoire
                    </span>

                    <h2
                        id="random-name"
                        class="random-character-name"
                    ></h2>

                    <p
                        id="random-description"
                        class="random-character-description"
                    ></p>

                    <div
                        id="random-tags"
                        class="tags"
                    ></div>

                    <br>

                    <a
                        id="random-details"
                        class="btn btn-secondary"
                        href="#"
                    >
                        Voir le personnage
                    </a>

                </div>

            </div>

        </div>

    </section>

</main>

<footer class="footer">

    <div class="footer-container">

        <p>
            © 2026 Anibook
        </p>

    </div>

</footer>

<script src="js/main.js"></script>

</body>
</html>
