<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anibook — Personnages</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="navbar-container">

        <a href="index.html" class="logo">
            <span class="logo-icon">A</span>
            <span class="logo-text">Anibook</span>
        </a>

        <div class="nav-links">
            <a href="index.html" class="nav-link">
                Accueil
            </a>

            <a href="characters.html" class="nav-link active">
                Personnages
            </a>

            <a href="random.html" class="nav-link">
                Random
            </a>

            <a href="quiz.html" class="nav-link">
                Quiz
            </a>

            <a href="admin.html" class="nav-link">
                Admin
            </a>
        </div>

        <button class="nav-toggle" type="button">
            ☰
        </button>

    </div>
</nav>

<main>

    <section class="page-header">
        <div class="container">

            <h1>
                Catalogue des
                <span class="gradient-text">
                    personnages
                </span>
            </h1>

            <p>
                Découvre tous les personnages présents dans la base
                de données Anibook.
            </p>

        </div>
    </section>

    <section class="container">

        <div class="filters">

            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    type="search"
                    id="character-search"
                    class="form-control"
                    placeholder="Rechercher un personnage..."
                    autocomplete="off"
                >

            </div>

            <select
                id="universe-filter"
                class="form-control"
            >
                <option value="">
                    Tous les univers
                </option>
            </select>

            <select
                id="tag-filter"
                class="form-control"
            >
                <option value="">
                    Tous les tags
                </option>
            </select>

            <button
                id="filter-reset"
                class="btn btn-secondary"
                type="button"
            >
                Réinitialiser
            </button>

        </div>

        <div
            id="characters-loading"
            class="loading"
        >
            <span class="spinner" aria-hidden="true"></span>
            <span>Chargement des personnages...</span>
        </div>

        <div
            id="characters-empty"
            class="empty-state"
            hidden
        >
            Aucun personnage ne correspond à votre recherche.
        </div>

        <div
            id="characters-grid"
            class="characters-grid"
        ></div>

    </section>

</main>

<footer class="footer">

    <div class="footer-container">

        <p>
            © 2026 Anibook
        </p>

    </div>

</footer>

<script src="js/main.js"></script>

</body>
</html>
